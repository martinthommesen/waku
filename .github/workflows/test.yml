name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.96.0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            cmake \
            libfontconfig-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            pkg-config \
            xdg-desktop-portal

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.96.0-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-1.96.0-cargo-

      - name: Format check (informational until pre-existing drift is cleaned up)
        continue-on-error: true
        run: cargo fmt --package waku --package waku-protocol --package waku-client --package waku-core --package waku-daemon -- --check

      - name: Clippy (informational)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets

      - name: Run tests
        run: cargo test --locked

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Check generated protocol and browser clients
        run: |
          bun run protocol:check
          bun run --filter @waku/client check
          bun run --filter @waku/client test
          bun run --filter @waku/web typecheck
          bun run --filter @waku/web test
